<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort-Hash erzeugen</title>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;line-height:1.5}
input{width:100%;padding:10px;font-size:18px;box-sizing:border-box}
code{display:block;word-break:break-all;background:#eef;padding:10px;margin-top:12px;border-radius:6px}
</style>
</head>
<body>
<h1>Passwort-Hash erzeugen</h1>
<p>Gib dein neues Passwort ein. Den Hash trägst du in <b>firebase-config.js</b> bei <b>adminPasswordSha256</b> ein. Das Passwort selbst verlässt diese Seite nicht.</p>
<input id="pw" type="text" placeholder="Neues Passwort" autocomplete="off">
<code id="out">Hash erscheint hier</code>
<script>
document.getElementById("pw").addEventListener("input", async function (e) {
  var v = e.target.value;
  if (!v) { document.getElementById("out").textContent = "Hash erscheint hier"; return; }
  var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(v));
  document.getElementById("out").textContent = Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
});
</script>
</body>
</html>
